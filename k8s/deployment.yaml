apiVersion: apps/v1
kind: Deployment
metadata:
  name: saanse-app
  namespace: saanse
  labels:
    app.kubernetes.io/name: saanse
    app.kubernetes.io/component: application
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: saanse
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saanse
        app.kubernetes.io/component: application
        app.kubernetes.io/version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: saanse-app
        image: saanse:latest
        imagePullPolicy: Never  # For local Minikube development
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: saanse-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: saanse-config
              key: PORT
        - name: BASE_URL
          valueFrom:
            configMapKeyRef:
              name: saanse-config
              key: BASE_URL
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: saanse-secrets
              key: SUPABASE_URL
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: saanse-secrets
              key: SUPABASE_SERVICE_ROLE_KEY
        - name: VITE_SUPABASE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: saanse-secrets
              key: VITE_SUPABASE_PUBLISHABLE_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: saanse-secrets
              key: DATABASE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Set to true if app doesn't need to write to filesystem
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
